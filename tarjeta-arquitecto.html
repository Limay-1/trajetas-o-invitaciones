<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta Digital | Arquitecto</title>
<style>
  :root{
    --fondo:#0c2338;
    --fondo-2:#123352;
    --linea:rgba(190,225,250,.14);
    --trazo:#cfe8f8;
    --acento:#6cc4ff;
    --tinta:#eef7fd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
    background:#07141f;
    color:var(--tinta);
    display:flex;justify-content:center;align-items:center;
    padding:24px 16px;
  }
  .tarjeta{
    width:100%;max-width:400px;
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(108,196,255,.35);
    background:
      linear-gradient(var(--linea) 1px,transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg,var(--linea) 1px,transparent 1px) 0 0/24px 24px,
      linear-gradient(180deg,var(--fondo-2),var(--fondo));
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    padding:44px 28px 28px;
    text-align:center;
  }
  .logo{
    width:128px;height:128px;margin:0 auto;
    border:2px solid var(--acento);
    border-radius:50%;
    background:var(--fondo);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 7px rgba(108,196,255,.12);
  }
  .logo svg{width:80px;height:80px}
  h1{font-size:1.55rem;font-weight:600;margin-top:26px;letter-spacing:.3px}
  .rol{margin-top:6px;color:var(--acento);font-size:1rem}
  .reg{margin-top:4px;font-size:.88rem;opacity:.75}
  .cota{
    display:flex;align-items:center;gap:8px;
    margin:20px auto 4px;width:78%;
    color:var(--trazo);opacity:.7;
  }
  .cota::before,.cota::after{content:"";flex:1;height:1px;background:var(--trazo)}
  .cota i{width:7px;height:7px;border:1.5px solid var(--trazo);transform:rotate(45deg)}
  .iconos{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:16px;margin-top:22px;
  }
  .icono{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    text-decoration:none;color:var(--tinta);font-size:.82rem;
  }
  .icono span.caja{
    width:68px;height:68px;border-radius:14px;
    border:1.5px solid var(--trazo);
    display:flex;align-items:center;justify-content:center;
    background:rgba(12,35,56,.7);
    transition:background .2s,color .2s,border-color .2s;
  }
  .icono:hover .caja,.icono:focus-visible .caja{background:var(--acento);color:var(--fondo);border-color:var(--acento)}
  .icono:focus-visible{outline:none}
  svg.i{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  svg.i .r{fill:currentColor;stroke:none}
  @media (min-width:900px){.tarjeta{max-width:440px}}
</style>
</head>
<body>
<main class="tarjeta">
  <div class="logo" aria-hidden="true">
    <!-- Edificio isométrico -->
    <svg viewBox="0 0 80 80" fill="none" stroke="#cfe8f8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M40 8L66 22v30L40 66 14 52V22z"/>
      <path d="M14 22l26 14 26-14M40 36v30"/>
      <path d="M24 34v10M32 38v10M48 38v10M56 34v10" stroke="#6cc4ff"/>
    </svg>
  </div>

  <h1>Nombre Apellido</h1>
  <p class="rol">Arquitecto · Diseño y Construcción</p>
  <p class="reg">Registro profesional N.º 0000</p>
  <div class="cota"><i></i></div>

  <nav class="iconos" aria-label="Contacto">
    <!-- CAMBIA los enlaces por los tuyos -->
    <a class="icono" href="https://wa.me/59170000000" target="_blank" rel="noopener">
      <span class="caja"><svg class="i" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"/><path class="r" d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/></svg></span>WhatsApp
    </a>
    <a class="icono" href="https://instagram.com/tuusuario" target="_blank" rel="noopener">
      <span class="caja"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="r" cx="17.3" cy="6.7" r="1"/></svg></span>Instagram
    </a>
    <a class="icono" href="mailto:correo@ejemplo.com">
      <span class="caja"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>Correo
    </a>
    <a class="icono" href="https://www.tusitio.com" target="_blank" rel="noopener">
      <span class="caja"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span>Sitio web
    </a>
    <a class="icono" href="portafolio.pdf" target="_blank" rel="noopener">
      <span class="caja"><svg class="i" viewBox="0 0 24 24"><path d="M3 10h18v10H3zM8 10V6h8v4M3 14h18"/></svg></span>Portafolio
    </a>
    <a class="icono" href="https://maps.google.com/?q=La+Paz+Bolivia" target="_blank" rel="noopener">
      <span class="caja"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg></span>Ubicación
    </a>
  </nav>
</main>
</body>
</html>
