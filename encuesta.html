<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta Digital | Importador</title>
<style>
:root{
    --bg-1:#2b2870;
    --bg-2:#14123a;
    --ink:#f3f2ff;
    --ink-soft:#b8b6d9;
    --ac:#ffb547;
    --ac-soft:rgba(255,181,71,.18);
    --ac-glow:rgba(255,181,71,.5);
    --on:#1b1a3a;
    --box:rgba(10,9,40,.55);
    --box-hover:rgba(255,181,71,.12);
    --page:#0a0922;
    --radius:28px;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at 20% 0%, rgba(255,181,71,.08), transparent 45%),
        radial-gradient(circle at 80% 100%, rgba(255,181,71,.06), transparent 45%),
        var(--page);
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
}

/* --- TARJETA PRINCIPAL --- */
.tarjeta{
    width:100%;
    max-width:400px;
    border-radius:var(--radius);
    overflow:hidden;
    background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
    border:1px solid rgba(255,181,71,.4);
    box-shadow:
        0 24px 60px rgba(0,0,0,.5),
        0 0 0 1px rgba(255,181,71,.08) inset,
        0 0 80px rgba(255,181,71,.06);
    padding:46px 28px 32px;
    text-align:center;
    position:relative;
    animation:entrada .7s cubic-bezier(.22,1,.36,1);
}

/* Brillo decorativo superior */
.tarjeta::before{
    content:'';
    position:absolute;
    top:-60%;left:50%;
    transform:translateX(-50%);
    width:120%;height:60%;
    background:radial-gradient(ellipse at center, rgba(255,181,71,.18), transparent 70%);
    pointer-events:none;
}

/* Textura sutil de puntos */
.tarjeta::after{
    content:'';
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:18px 18px;
    pointer-events:none;
    opacity:.6;
}
.tarjeta > *{position:relative;z-index:1}

@keyframes entrada{
    from{opacity:0;transform:translateY(24px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
}

/* --- LOGO / AVATAR --- */
.logo{
    width:126px;height:126px;
    margin:0 auto;
    border-radius:50%;
    border:2px solid var(--ac);
    background:radial-gradient(circle at 30% 25%, #1e1b4d, #0f0d2e);
    display:flex;align-items:center;justify-content:center;
    box-shadow:
        0 0 0 7px var(--ac-soft),
        0 0 30px rgba(255,181,71,.3),
        0 12px 30px rgba(0,0,0,.45);
    transition:transform .4s ease, box-shadow .4s ease;
}
.logo:hover{
    transform:scale(1.04);
    box-shadow:
        0 0 0 9px var(--ac-soft),
        0 0 45px rgba(255,181,71,.45),
        0 12px 30px rgba(0,0,0,.45);
}
.logo svg{
    width:74px;height:74px;
    fill:none;
    stroke:var(--ac);
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(255,181,71,.45));
}

/* --- TEXTOS --- */
h1{
    font-size:1.6rem;
    font-weight:600;
    margin-top:28px;
    letter-spacing:.3px;
    color:var(--ink);
}
.rol{
    margin-top:8px;
    color:var(--ac);
    font-size:1rem;
    font-weight:600;
    letter-spacing:.8px;
    text-transform:uppercase;
}
.lema{
    margin-top:8px;
    font-size:.88rem;
    color:var(--ink-soft);
    line-height:1.5;
    max-width:280px;
    margin-left:auto;
    margin-right:auto;
}

/* Separador decorativo con diamante */
.linea{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:24px auto 0;
    width:80%;
    opacity:.75;
}
.linea::before,.linea::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--ac),transparent);
}
.linea .diamante{
    width:7px;height:7px;
    background:var(--ac);
    transform:rotate(45deg);
    border-radius:1px;
    box-shadow:0 0 8px var(--ac-glow);
}

/* --- ICONOS --- */
.iconos{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px 14px;
    margin-top:28px;
}
.icono{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    text-decoration:none;
    color:var(--ink);
    font-size:.8rem;
    font-weight:500;
    letter-spacing:.3px;
    transition:color .25s ease;
}
.icono:hover,.icono:focus-visible{
    color:var(--ac);
    outline:none;
}
.caja{
    width:66px;height:66px;
    border-radius:50%;
    border:1.5px solid rgba(255,181,71,.55);
    background:var(--box);
    display:flex;align-items:center;justify-content:center;
    color:var(--ac);
    transition:all .3s cubic-bezier(.22,1,.36,1);
    position:relative;
}
.caja::after{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:1px solid transparent;
    transition:border-color .3s ease;
}
.icono:hover .caja,
.icono:focus-visible .caja{
    background:var(--ac);
    color:var(--on);
    border-color:var(--ac);
    transform:translateY(-4px) scale(1.06);
    box-shadow:0 10px 22px rgba(255,181,71,.4), 0 0 22px rgba(255,181,71,.35);
}
.icono:hover .caja::after,
.icono:focus-visible .caja::after{
    border-color:var(--ac-soft);
}
svg.i{
    width:28px;height:28px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .3s ease;
}
.icono:hover svg.i{transform:scale(1.08)}
svg.i .r{fill:currentColor;stroke:none}

/* --- RESPONSIVE --- */
@media(min-width:900px){
    .tarjeta{max-width:440px;padding:50px 34px 36px}
}
@media(max-width:360px){
    .tarjeta{padding:38px 20px 26px;border-radius:22px}
    .logo{width:110px;height:110px}
    .logo svg{width:64px;height:64px}
    h1{font-size:1.4rem}
    .iconos{gap:14px 10px}
    .caja{width:58px;height:58px}
    svg.i{width:24px;height:24px}
}
</style>
</head>
<body>
<main class="tarjeta">

    <!-- Logo / Avatar -->
    <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="26"/>
            <path d="M14 40h52"/>
            <path d="M40 14c14 14 14 38 0 52"/>
            <path d="M40 14c-14 14-14 38 0 52"/>
        </svg>
    </div>

    <!-- Nombre y datos -->
    <h1>Nombre Apellido</h1>
    <p class="rol">Importaciones y Comercio</p>
    <p class="lema">Productos directos de fábrica a tu negocio</p>

    <!-- Separador decorativo -->
    <div class="linea" aria-hidden="true"><span class="diamante"></span></div>

    <!-- Iconos de contacto -->
    <nav class="iconos" aria-label="Contacto">
        <a class="icono" href="https://wa.me/59170000000" target="_blank" rel="noopener" aria-label="WhatsApp">
            <span class="caja">
                <svg class="i" viewBox="0 0 24 24">
                    <path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"/>
                    <path class="r" d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/>
                </svg>
            </span>
            WhatsApp
        </a>

        <a class="icono" href="https://instagram.com/tuusuario" target="_blank" rel="noopener" aria-label="Instagram">
            <span class="caja">
                <svg class="i" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle class="r" cx="17.3" cy="6.7" r="1"/>
                </svg>
            </span>
            Instagram
        </a>

        <a class="icono" href="https://www.tiktok.com/@tuusuario" target="_blank" rel="noopener" aria-label="TikTok">
            <span class="caja">
                <svg class="i" viewBox="0 0 24 24">
                    <path d="M14 3v11.5a3.6 3.6 0 1 1-3.6-3.6"/>
                    <path d="M14 3c.4 2.6 2 4.3 5 4.6"/>
                </svg>
            </span>
            TikTok
        </a>

        <a class="icono" href="catalogo.pdf" target="_blank" rel="noopener" aria-label="Catálogo">
            <span class="caja">
                <svg class="i" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
            </span>
            Catálogo
        </a>

        <a class="icono" href="mailto:correo@ejemplo.com" aria-label="Correo">
            <span class="caja">
                <svg class="i" viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                    <path d="M3 7l9 6 9-6"/>
                </svg>
            </span>
            Correo
        </a>

        <a class="icono" href="https://www.tusitio.com" target="_blank" rel="noopener" aria-label="Sitio web">
            <span class="caja">
                <svg class="i" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M3 12h18"/>
                    <path d="M12 3c3 3 3 15 0 18"/>
                    <path d="M12 3c-3 3-3 15 0 18"/>
                </svg>
            </span>
            Sitio web
        </a>
    </nav>

</main>
</body>
</html>
