<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta a Padres de Familia - Seguimiento Académico</title>
    <!-- Librería para generar el PDF desde el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #319795;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        .header p {
            color: #718096;
            margin: 0;
            font-size: 14px;
        }

        .section-title {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .question {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
        }

        .question label.q-title {
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .option-label:hover {
            background-color: #edf2f7;
        }

        input[type="radio"], input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--secondary-color);
            cursor: pointer;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            margin-top: 5px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
        }

        .btn-submit {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--primary-color);
        }

        /* Estilos específicos para impresión / PDF */
        @media print {
            .btn-container { display: none; }
            body { padding: 0; background: white; }
            .container { box-shadow: none; padding: 20px; }
            .option-label:hover { background: transparent; }
        }
    </style>
</head>
<body>

<div class="container" id="encuesta-content">
    <div class="header">
        <h1>Encuesta a Padres de Familia</h1>
        <p>Seguimiento Académico y Comunicación Colegio-Hogar</p>
    </div>

    <form id="quizForm">
        <!-- DATOS DEMOGRÁFICOS BÁSICOS -->
        <div class="section-title">Información General</div>
        
        <div class="question">
            <label class="q-title">Género:</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="genero" value="Femenino"> Femenino</label>
                <label class="option-label"><input type="radio" name="genero" value="Masculino"> Masculino</label>
                <label class="option-label"><input type="radio" name="genero" value="Prefiero no decir"> Prefiero no decir</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">1. ¿Cuántos hijos tiene actualmente cursando en el colegio o escuela?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p1" value="1"> 1</label>
                <label class="option-label"><input type="radio" name="p1" value="2"> 2</label>
                <label class="option-label"><input type="radio" name="p1" value="3"> 3</label>
                <label class="option-label"><input type="radio" name="p1" value="4 o más"> 4 o más</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">2. ¿En qué nivel escolar se encuentran sus hijos? (Puede marcar varias)</label>
            <div class="options">
                <label class="option-label"><input type="checkbox" name="p2" value="Inicial"> Nivel Inicial (Kínder / Pre-kínder)</label>
                <label class="option-label"><input type="checkbox" name="p2" value="Primaria"> Nivel Primario</label>
                <label class="option-label"><input type="checkbox" name="p2" value="Secundaria"> Nivel Secundario</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">3. ¿Cuál es su ocupación laboral o actividad principal?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p3" value="Horario Fijo"> Trabajo con horario fijo (oficina, fábrica, institución, etc.)</label>
                <label class="option-label"><input type="radio" name="p3" value="Independiente"> Trabajo independiente / Comercio / Negocio propio</label>
                <label class="option-label"><input type="radio" name="p3" value="Hogar"> Labores del hogar / Cuidado de la familia</label>
                <label class="option-label"><input type="radio" name="p3" value="Eventual"> Trabajo eventual / Ocasional</label>
                <label class="option-label"><input type="radio" name="p3" value="Otro"> Otro</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">4. Por su disponibilidad de tiempo, ¿con qué frecuencia puede acudir presencialmente al colegio?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p4" value="Varias veces por semana"> Varias veces por semana</label>
                <label class="option-label"><input type="radio" name="p4" value="Una vez por semana"> Una vez por semana</label>
                <label class="option-label"><input type="radio" name="p4" value="Algunas veces al mes"> Algunas veces al mes</label>
                <label class="option-label"><input type="radio" name="p4" value="Solo cuando me citan"> Solo cuando me citan los profesores o dirección</label>
                <label class="option-label"><input type="radio" name="p4" value="Casi nunca"> Casi nunca por temas de horario / trabajo</label>
            </div>
        </div>

        <!-- PARTE 1: SITUACIÓN ACTUAL -->
        <div class="section-title">Parte 1: Comunicación y Seguimiento de Calificaciones</div>

        <div class="question">
            <label class="q-title">5. ¿Cómo se entera actualmente sobre las notas, tareas y el rendimiento de su hijo/a? (Puede marcar varias)</label>
            <div class="options">
                <label class="option-label"><input type="checkbox" name="p5" value="Presencial"> Voy presencialmente a hablar con el tutor/profesor</label>
                <label class="option-label"><input type="checkbox" name="p5" value="Reuniones"> Reuniones de padres de familia / Entrega de libretas</label>
                <label class="option-label"><input type="checkbox" name="p5" value="WhatsApp"> Grupos de WhatsApp del curso</label>
                <label class="option-label"><input type="checkbox" name="p5" value="Agenda"> Agenda o cuaderno escolar</label>
                <label class="option-label"><input type="checkbox" name="p5" value="Avisos"> Notificaciones o avisos escritos del colegio</label>
                <label class="option-label"><input type="checkbox" name="p5" value="Hijo"> Me informa mi propio hijo/a</label>
                <label class="option-label"><input type="checkbox" name="p5" value="Plataforma"> Plataforma / Sistema actual del colegio</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">6. Cuando su hijo/a obtiene una baja calificación o no entrega una tarea, ¿cómo suele enterarse?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p6" value="Llamada docente"> El profesor/a me escribe o me llama directamente</label>
                <label class="option-label"><input type="radio" name="p6" value="Agenda"> Veo la nota firmada en la agenda o cuaderno</label>
                <label class="option-label"><input type="radio" name="p6" value="Hijo"> Mi hijo/a me cuenta en casa</label>
                <label class="option-label"><input type="radio" name="p6" value="Conocidos"> Por medio de conocidos, amigos, apoderados o compañeros de curso</label>
                <label class="option-label"><input type="radio" name="p6" value="Reunión trimestre"> Me entero en la reunión al finalizar el trimestre</label>
                <label class="option-label"><input type="radio" name="p6" value="Citación"> Me entero cuando me citan por bajas calificaciones</label>
                <label class="option-label"><input type="radio" name="p6" value="No a tiempo"> No suelo enterarme a tiempo</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">7. ¿Alguna vez le ha pasado que se enteró muy tarde de que su hijo/a estaba perdiendo la materia o tenía varias casilleras vacías?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p7" value="Varias veces"> Sí, me ha pasado varias veces</label>
                <label class="option-label"><input type="radio" name="p7" value="Alguna vez"> Sí, me pasó alguna vez</label>
                <label class="option-label"><input type="radio" name="p7" value="No"> No, siempre me entero a tiempo</label>
                <label class="option-label"><input type="radio" name="p7" value="No estoy seguro"> No estoy seguro/a</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">8. Si se hubiera enterado a tiempo de que su hijo/a tenía bajas notas, ¿usted habría intervenido para ayudarlo/a a estudiar y evitar que pierda la materia?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p8" value="Totalmente"> Sí, totalmente; habría buscado apoyo o reforzado sus estudios a tiempo</label>
                <label class="option-label"><input type="radio" name="p8" value="Probablemente"> Probablemente sí; habría hablado con el profesor o con mi hijo/a</label>
                <label class="option-label"><input type="radio" name="p8" value="Tal vez"> Tal vez; dependería de la materia o de mi tiempo</label>
                <label class="option-label"><input type="radio" name="p8" value="No"> No; considero que es responsabilidad exclusiva del estudiante</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">9. ¿Cuál es el principal obstáculo que tiene para hacer un seguimiento continuo a las notas? (Puede marcar varias)</label>
            <div class="options">
                <label class="option-label"><input type="checkbox" name="p9" value="Horarios"> Choque de horarios de trabajo con la atención de profesores</label>
                <label class="option-label"><input type="checkbox" name="p9" value="Fin de trimestre"> La información solo la entregan al final del trimestre</label>
                <label class="option-label"><input type="checkbox" name="p9" value="WhatsApp desorden"> Los grupos de WhatsApp se llenan de mensajes no relacionados</label>
                <label class="option-label"><input type="checkbox" name="p9" value="Depende del hijo"> Dependo de lo que me dice mi hijo/a o de revisarle los cuadernos</label>
                <label class="option-label"><input type="checkbox" name="p9" value="Falta comunicación"> Falta de comunicación directa con los docentes</label>
                <label class="option-label"><input type="checkbox" name="p9" value="Ninguna"> No tengo ninguna dificultad</label>
            </div>
        </div>

        <!-- PARTE 2: PROPUESTA DE PLATAFORMA -->
        <div class="section-title">Parte 2: Plataforma Web / Aplicación Móvil</div>

        <div class="question">
            <label class="q-title">10. Si el colegio contara con una plataforma web o app para consultar la información escolar desde su celular, ¿qué tan útil le parecería?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p10" value="Muy útil"> Muy útil</label>
                <label class="option-label"><input type="radio" name="p10" value="Útil"> Útil</label>
                <label class="option-label"><input type="radio" name="p10" value="Poco útil"> Poco útil</label>
                <label class="option-label"><input type="radio" name="p10" value="Nada útil"> Nada útil</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">11. ¿Qué información le gustaría consultar de forma inmediata en la plataforma? (Puede marcar varias)</label>
            <div class="options">
                <label class="option-label"><input type="checkbox" name="p11" value="Notas"> Calificaciones y centralizador por trimestre</label>
                <label class="option-label"><input type="checkbox" name="p11" value="Asistencia"> Registro de asistencia y atrasos</label>
                <label class="option-label"><input type="checkbox" name="p11" value="Tareas"> Tareas, trabajos prácticos y fechas de exámenes</label>
                <label class="option-label"><input type="checkbox" name="p11" value="Conducta"> Observaciones de conducta o notas de disciplina</label>
                <label class="option-label"><input type="checkbox" name="p11" value="Comunicados"> Comunicados oficiales y citaciones de la dirección</label>
                <label class="option-label"><input type="checkbox" name="p11" value="Calendario"> Calendario de actividades y feriados escolares</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">12. Si se registra una nota baja o atraso, ¿le gustaría recibir una notificación o alerta en su celular?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p12" value="Inmediata"> Sí, de inmediato</label>
                <label class="option-label"><input type="radio" name="p12" value="Semanal"> Sí, mediante un resumen semanal</label>
                <label class="option-label"><input type="radio" name="p12" value="No"> No, prefiero enterarme solo en la libreta/reunión</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">13. Como valor agregado, la plataforma incluye un Examen Simulacro presencial y un Seminario de Orientación Vocacional en el colegio. ¿Qué tan valioso considera este servicio para su hijo/a?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p13" value="Muy valioso"> Muy valioso</label>
                <label class="option-label"><input type="radio" name="p13" value="Valioso"> Valioso</label>
                <label class="option-label"><input type="radio" name="p13" value="Poco valioso"> Poco valioso</label>
                <label class="option-label"><input type="radio" name="p13" value="Nada valioso"> Nada valioso</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">14. ¿Qué monto anual por estudiante consideraría razonable por el servicio completo (App Móvil + Examen Simulacro + Seminario Vocacional)?</label>
            <div class="options">
                <label class="option-label"><input type="radio" name="p14" value="Menos de Bs 20"> Menos de Bs 20</label>
                <label class="option-label"><input type="radio" name="p14" value="Bs 20 - 35"> Entre Bs 20 y Bs 35</label>
                <label class="option-label"><input type="radio" name="p14" value="Bs 36 - 50"> Entre Bs 36 y Bs 50</label>
                <label class="option-label"><input type="radio" name="p14" value="Bs 51 - 80"> Entre Bs 51 y Bs 80</label>
                <label class="option-label"><input type="radio" name="p14" value="Más de Bs 80"> Más de Bs 80</label>
                <label class="option-label"><input type="radio" name="p14" value="No pagaría"> No estaría dispuesto/a a pagar</label>
            </div>
        </div>

        <div class="question">
            <label class="q-title">15. Sugerencias o comentarios adicionales:</label>
            <textarea name="p15" placeholder="Escriba aquí sus observaciones..."></textarea>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-submit" onclick="descargarPDF()">Guardar y Descargar en PDF</button>
        </div>
    </form>
</div>

<script>
    function descargarPDF() {
        // Elemento a convertir
        const element = document.getElementById('encuesta-content');
        
        // Opciones de configuración para html2pdf
        const opt = {
            margin:       [10, 10, 10, 10],
            filename:     'Encuesta_Padres_Familia.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'letter', orientation: 'portrait' }
        };

        // Generar el archivo PDF
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
