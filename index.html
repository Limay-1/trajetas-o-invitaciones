<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta Digital | Psicólogo</title>
<style>
:root{--b1:#e6eee8;--b2:#c6dacb;--ink:#23392f;--ac:#3f6b55;--on:#ffffff;--box:rgba(255,255,255,.6);--page:#a9c2b0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Georgia,serif;background:var(--page);color:var(--ink);display:flex;justify-content:center;align-items:center;padding:24px 16px}
.tarjeta{width:100%;max-width:400px;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,var(--b1),var(--b2));border:1px solid var(--ac);box-shadow:0 24px 60px rgba(0,0,0,.35);padding:44px 28px 30px;text-align:center}
.logo{width:124px;height:124px;margin:0 auto;border-radius:50%;border:2px solid var(--ac);background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 7px rgba(63,107,85,.18)}
.logo svg{width:76px;height:76px;fill:none;stroke:var(--ac);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:1.55rem;font-weight:600;margin-top:26px}
.rol{margin-top:6px;color:var(--ac);font-size:1rem;font-weight:600}
.lema{margin-top:6px;font-size:.9rem;opacity:.8}
.linea{width:70%;height:1px;background:var(--ac);opacity:.6;margin:18px auto 0}
.iconos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.icono{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-size:.82rem}
.caja{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--ac);background:var(--box);display:flex;align-items:center;justify-content:center;color:var(--ac);transition:background .2s,color .2s}
.icono:hover .caja,.icono:focus-visible .caja{background:var(--ac);color:var(--on)}
.icono:focus-visible{outline:none}
svg.i{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.i .r{fill:currentColor;stroke:none}
@media(min-width:900px){.tarjeta{max-width:440px}}
</style></head><body>
<main class="tarjeta">
<div class="logo" aria-hidden="true"><svg viewBox="0 0 80 80"><path d="M40 12v56M20 18c0 20 7 28 20 28s20-8 20-28M30 68h20"/></svg></div>
<h1>Nombre Apellido</h1>
<p class="rol">Psicólogo Clínico</p>
<p class="lema">Un espacio seguro para tu bienestar</p>
<div class="linea"></div>
<nav class="iconos" aria-label="Contacto">
<!-- CAMBIA los enlaces por los tuyos -->
<a class="icono" href="https://wa.me/59170000000?text=Hola,%20quiero%20agendar%20una%20cita" target="_blank" rel="noopener"><span class="caja"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Agendar cita</a>
<a class="icono" href="https://wa.me/59170000000" target="_blank" rel="noopener"><span class="caja"><svg class="i" viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"/><path class="r" d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/></svg></span>WhatsApp</a>
<a class="icono" href="https://instagram.com/tuusuario" target="_blank" rel="noopener"><span class="caja"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="r" cx="17.3" cy="6.7" r="1"/></svg></span>Instagram</a>
<a class="icono" href="https://www.tiktok.com/@tuusuario" target="_blank" rel="noopener"><span class="caja"><svg class="i" viewBox="0 0 24 24"><path d="M14 3v11.5a3.6 3.6 0 1 1-3.6-3.6M14 3c.4 2.6 2 4.300 5 4.600"/></svg></span>TikTok</a>
<a class="icono" href="mailto:correo@ejemplo.com" target="_blank" rel="noopener"><span class="caja"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>Correo</a>
<a class="icono" href="https://maps.google.com/?q=La+Paz+Bolivia" target="_blank" rel="noopener"><span class="caja"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>Ubicación</a>

</nav>
</main></body></html>
