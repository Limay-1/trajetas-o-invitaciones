<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta Digital | Abogado</title>
<style>
  :root{
    --vino:#5a2a22;
    --vino-oscuro:#2e1411;
    --negro:#17100e;
    --oro:#d4a85a;
    --oro-claro:#ecd29a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:Georgia,"Times New Roman",serif;
    background:radial-gradient(ellipse at top,#4a2018 0%,var(--vino-oscuro) 60%,#140907 100%);
    color:var(--oro-claro);
    display:flex;justify-content:center;align-items:center;
    padding:24px 16px;
  }
  .tarjeta{
    width:100%;max-width:400px;
    background:linear-gradient(180deg,#2a1713 0,var(--vino) 38%,var(--vino-oscuro) 100%);
    border:1px solid var(--oro);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  .portada{
    height:150px;
    background:
      linear-gradient(180deg,rgba(23,16,14,.2),var(--vino)),
      repeating-linear-gradient(90deg,#3b1e18 0 18px,#2f1812 18px 36px);
  }
  .logo{
    width:150px;height:150px;margin:-75px auto 0;
    border-radius:50%;
    background:var(--negro);
    border:3px solid var(--oro);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 6px rgba(212,168,90,.18);
  }
  .logo svg{width:92px;height:92px}
  .datos{text-align:center;padding:22px 24px 8px}
  h1{font-size:1.5rem;font-weight:normal;color:var(--oro-claro);letter-spacing:.5px}
  .linea{width:70%;height:1px;background:var(--oro);margin:10px auto}
  .profesion{font-size:1rem;color:var(--oro)}
  .registro{font-size:.9rem;opacity:.85;margin-top:4px}
  .iconos{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:20px;justify-items:center;
    padding:26px 40px 12px;
  }
  .icono{
    width:92px;height:92px;border-radius:50%;
    border:2px solid var(--oro);
    display:flex;align-items:center;justify-content:center;
    color:var(--oro);text-decoration:none;
    background:rgba(23,16,14,.35);
    transition:background .2s,color .2s,transform .2s;
  }
  .icono:hover,.icono:focus-visible{background:var(--oro);color:var(--negro);transform:scale(1.06);outline:none}
  .icono svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .icono svg .rell{fill:currentColor;stroke:none}
  .pie{text-align:center;padding:14px 24px 26px;font-family:Arial,sans-serif;font-size:.85rem;letter-spacing:.5px}
  .pie span{color:var(--oro)}
  @media (min-width:900px){
    .tarjeta{max-width:440px}
  }
</style>
</head>
<body>
<main class="tarjeta">
  <div class="portada" role="img" aria-label="Fondo de despacho jurídico"></div>

  <div class="logo" aria-hidden="true">
    <!-- Balanza de la justicia -->
    <svg viewBox="0 0 100 100" fill="none" stroke="#d4a85a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="50" y1="12" x2="50" y2="84"/>
      <circle cx="50" cy="11" r="3" fill="#d4a85a"/>
      <line x1="16" y1="26" x2="84" y2="26"/>
      <line x1="16" y1="26" x2="8" y2="52"/><line x1="16" y1="26" x2="24" y2="52"/>
      <path d="M6 52h20a10 8 0 0 1-20 0z" fill="#d4a85a"/>
      <line x1="84" y1="26" x2="76" y2="52"/><line x1="84" y1="26" x2="92" y2="52"/>
      <path d="M74 52h20a10 8 0 0 1-20 0z" fill="#d4a85a"/>
      <path d="M34 90h32M40 84h20"/>
    </svg>
  </div>

  <section class="datos">
    <h1>Nombre Apellido</h1>
    <div class="linea"></div>
    <p class="profesion">Abogacía y Consultoría Jurídica</p>
    <p class="registro">Matrícula N.º 0000</p>
  </section>

  <nav class="iconos" aria-label="Contacto">
    <!-- CAMBIA los enlaces por los tuyos -->
    <a class="icono" href="https://wa.me/59170000000" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.7A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z" class="rell"/></svg>
    </a>
    <a class="icono" href="https://instagram.com/tuusuario" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" class="rell"/></svg>
    </a>
    <a class="icono" href="mailto:correo@ejemplo.com" aria-label="Correo electrónico">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    </a>
    <a class="icono" href="https://www.tusitio.com" target="_blank" rel="noopener" aria-label="Sitio web">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
    </a>
  </nav>

  <p class="pie"><span>☝</span> TOCA LOS ÍCONOS</p>
</main>
</body>
</html>
